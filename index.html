/* ── GitHub API ── */
async function ghLoad(){
  try{
    const r=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}?ref=${GH_BRANCH}&t=${Date.now()}`,{headers:{Accept:"application/vnd.github.v3+json"},cache:"no-store"});
    if(!r.ok)return{data:DEFAULTS,sha:null};
    const j=await r.json();
    const content=JSON.parse(atob(j.content.replace(/\n/g,"")));
    return{data:{...DEFAULTS,...content},sha:j.sha};
  }catch(e){return{data:DEFAULTS,sha:null}}
}
async function ghSave(data,sha,token){
  const body={message:"Update site data",content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)))),branch:GH_BRANCH};
  if(sha)body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`,{
    method:"PUT",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json",Accept:"application/vnd.github.v3+json"},body:JSON.stringify(body)
  });
  if(!r.ok){const e=await r.json();throw new Error(e.message||"Save failed")}
  const j=await r.json();return j.content.sha;
}

/* ── Login Modal (stable) ── */
function LoginModal({open,onClose,onLogin}){
  const[pw,setPw]=useState("");
  const[tk,setTk]=useState("");
  const[err,setErr]=useState("");
  if(!open)return null;
  const handleLogin=()=>{
    if(pw!==PASS){setErr("Invalid password");return}
    if(!tk.trim()){setErr("GitHub token is required");return}
    onLogin(tk);setPw("");setTk("");setErr("");
  };
  const handleClose=()=>{setPw("");setTk("");setErr("");onClose()};
  return <Overlay onClose={handleClose}>
    <h3 style={{fontSize:"20px",fontWeight:700,color:"#e2e8f0",marginBottom:"8px"}}>Admin Login</h3>
    <p style={{color:"#64748b",fontSize:"13px",marginBottom:"20px"}}>Enter your credentials to manage content.</p>
    <Field label="Password" value={pw} onChange={e=>{setPw(e.target.value);setErr("")}} type="password"/>
    <Field label="GitHub Token (for publishing)" value={tk} onChange={e=>{setTk(e.target.value);setErr("")}} type="password"/>
    <p style={{color:"#475569",fontSize:"11px",marginBottom:"12px"}}>Token is stored in memory only — never saved to disk or code.</p>
    {err&&<p style={{color:"#ef4444",fontSize:"13px",marginBottom:"10px"}}>{err}</p>}
    <div style={{display:"flex",gap:"10px",justifyContent:"flex-end"}}><Btn onClick={handleClose}>Cancel</Btn><Btn primary onClick={handleLogin}>Login</Btn></div>
  </Overlay>;
}

  const HomePage=()=><div>
    <div style={{position:"relative",overflow:"hidden",borderRadius:"20px",background:"linear-gradient(135deg,#0f0f1a,#13132a 50%,#1a0f2e)",padding:"60px 40px",marginBottom:"50px",border:"1px solid rgba(99,102,241,.1)"}}>
      <div style={{position:"absolute",inset:0,overflow:"hidden"}}>{[...Array(12)].map((_,i)=><Dot key={i} i={i}/>)}<div style={{position:"absolute",top:"-50%",right:"-20%",width:"500px",height:"500px",borderRadius:"50%",background:"radial-gradient(circle,rgba(99,102,241,.08),transparent 70%)"}}/></div>
      <div style={{position:"relative",zIndex:1,display:"flex",gap:"40px",alignItems:"center",flexWrap:"wrap"}}>
        <ProfileAvatar d={d} admin={admin} openEdit={openEdit} updateData={updateData}/>
        <div style={{flex:1,minWidth:"260px"}}>
          <h1 style={{fontSize:"34px",fontWeight:800,marginBottom:"6px",background:"linear-gradient(135deg,#fff,#c7d2fe)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{d.name}</h1>
          <p style={{fontSize:"17px",color:"#818cf8",fontWeight:500,marginBottom:"4px"}}>{d.title}</p>
          <p style={{fontSize:"14px",color:"#94a3b8",marginBottom:"12px"}}>{d.affiliation}</p>
          <p style={{fontSize:"13px",color:"#64748b"}}>{"\uD83D\uDCCD"} {d.location}</p>
          {admin&&<div style={{marginTop:"10px"}}><Btn small onClick={()=>openEdit({title:"Edit Profile",fields:[{key:"name",label:"Name"},{key:"title",label:"Title"},{key:"affiliation",label:"Affiliation"},{key:"location",label:"Location"},{key:"email",label:"Email"},{key:"orcid",label:"ORCID"},{key:"github",label:"GitHub"},{key:"medium",label:"Medium"},{key:"scholar",label:"Google Scholar URL"},{key:"linkedin",label:"LinkedIn URL"},{key:"twitter",label:"Twitter/X URL"}],initial:{name:d.name,title:d.title,affiliation:d.affiliation,location:d.location,email:d.email,orcid:d.orcid,github:d.github,medium:d.medium,scholar:d.scholar,linkedin:d.linkedin,twitter:d.twitter},onSave:f=>updateData({...d,...f})})}>Edit Profile</Btn></div>}
        </div>
      </div>
    </div>
    <Sec title="About"><Card><p style={{lineHeight:1.8,color:"#cbd5e1",fontSize:"15px"}}>{d.bio}</p>{admin&&<div style={{marginTop:"10px"}}><Btn small onClick={()=>openEdit({title:"Edit Bio",fields:[{key:"bio",label:"Bio",multi:true}],initial:{bio:d.bio},onSave:f=>updateData({...d,bio:f.bio})})}>Edit</Btn></div>}</Card></Sec>
    <Sec title="Research Interests"><div style={{display:"flex",flexWrap:"wrap",gap:"10px"}}>{d.researchInterests.map((r,i)=><Tag key={i}>{r}</Tag>)}</div></Sec>
    <Sec title="Latest News">
      {d.news.map((n,i)=><Card key={i} style={{marginBottom:"10px",display:"flex",gap:"16px",alignItems:"flex-start",flexWrap:"wrap"}}><span style={{color:"#6366f1",fontSize:"13px",fontWeight:600,whiteSpace:"nowrap",minWidth:"80px"}}>{n.date}</span><span style={{color:"#cbd5e1",fontSize:"14px",flex:1}}>{n.text}</span><AdminBtns admin={admin} onEdit={()=>openEdit({title:"Edit News",fields:[{key:"date",label:"Date"},{key:"text",label:"Text"}],initial:n,onSave:f=>up("news",i,f)})} onDel={()=>delItem("news",i)}/></Card>)}
      {admin&&<div style={{marginTop:"10px"}}><Btn small onClick={()=>openEdit({title:"Add News",fields:[{key:"date",label:"Date"},{key:"text",label:"Text"}],initial:{},onSave:f=>add("news",f)})}>+ Add News</Btn></div>}
    </Sec>
    <Sec title="Education">
      {d.education.map((e,i)=><Card key={i} style={{marginBottom:"10px"}}><div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap"}}><div><h3 style={{fontSize:"15px",fontWeight:600,color:"#e2e8f0"}}>{e.degree}</h3><p style={{color:"#818cf8",fontSize:"14px"}}>{e.school}</p>{e.details&&<p style={{color:"#64748b",fontSize:"13px",marginTop:"4px"}}>{e.details}</p>}</div><span style={{color:"#6366f1",fontSize:"13px",fontWeight:600}}>{e.year}</span></div><AdminBtns admin={admin} onEdit={()=>openEdit({title:"Edit Education",fields:[{key:"degree",label:"Degree"},{key:"school",label:"School"},{key:"year",label:"Year"},{key:"details",label:"Details"}],initial:e,onSave:f=>up("education",i,f)})} onDel={()=>delItem("education",i)}/></Card>)}
      {admin&&<Btn small onClick={()=>openEdit({title:"Add Education",fields:[{key:"degree",label:"Degree"},{key:"school",label:"School"},{key:"year",label:"Year"},{key:"details",label:"Details"}],initial:{},onSave:f=>add("education",f)})}>+ Add</Btn>}
    </Sec>
    <Sec title="Experience">
      {d.experience.map((e,i)=><Card key={i} style={{marginBottom:"10px"}}><h3 style={{fontSize:"15px",fontWeight:600,color:"#e2e8f0"}}>{e.role}</h3><p style={{color:"#818cf8",fontSize:"14px"}}>{e.org}</p>{e.details&&<p style={{color:"#64748b",fontSize:"13px",marginTop:"4px"}}>{e.details}</p>}<AdminBtns admin={admin} onEdit={()=>openEdit({title:"Edit Experience",fields:[{key:"role",label:"Role"},{key:"org",label:"Organization"},{key:"period",label:"Period"},{key:"details",label:"Details"}],initial:e,onSave:f=>up("experience",i,f)})} onDel={()=>delItem("experience",i)}/></Card>)}
      {admin&&<Btn small onClick={()=>openEdit({title:"Add Experience",fields:[{key:"role",label:"Role"},{key:"org",label:"Organization"},{key:"period",label:"Period"},{key:"details",label:"Details"}],initial:{},onSave:f=>add("experience",f)})}>+ Add</Btn>}
    </Sec>
    <Sec title="Important Reads">
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:"16px"}}>
        {d.reads.map((r,i)=><a key={i} href={r.url} target="_blank" rel="noopener noreferrer" style={{textDecoration:"none"}}><Card style={{height:"100%",cursor:"pointer"}}><div style={{width:"100%",height:"8px",borderRadius:"4px",background:"linear-gradient(90deg,#6366f1,#8b5cf6,#a78bfa)",marginBottom:"16px"}}/><h4 style={{fontSize:"15px",fontWeight:600,color:"#e2e8f0",marginBottom:"6px",lineHeight:1.4}}>{r.title}</h4><p style={{color:"#94a3b8",fontSize:"13px",lineHeight:1.6,marginBottom:"8px"}}>{r.desc}</p><span style={{color:"#6366f1",fontSize:"12px",wordBreak:"break-all"}}>{r.url}</span>{admin&&<div onClick={e=>e.preventDefault()}><AdminBtns admin={admin} onEdit={()=>openEdit({title:"Edit Read",fields:[{key:"title",label:"Title"},{key:"url",label:"URL"},{key:"desc",label:"Description",multi:true}],initial:r,onSave:f=>up("reads",i,f)})} onDel={()=>delItem("reads",i)}/></div>}</Card></a>)}
      </div>
      {admin&&<div style={{marginTop:"12px"}}><Btn small onClick={()=>openEdit({title:"Add Read",fields:[{key:"title",label:"Title"},{key:"url",label:"URL"},{key:"desc",label:"Description",multi:true}],initial:{},onSave:f=>add("reads",f)})}>+ Add Read</Btn></div>}
    </Sec>
    <SocialBar d={d}/>
  </div>;

  const PubPage=()=><div>
    <div style={{display:"flex",gap:"8px",marginBottom:"30px",background:"rgba(13,13,26,.6)",padding:"6px",borderRadius:"10px",border:"1px solid rgba(99,102,241,.08)",width:"fit-content"}}>
      <TabBtn active={pubTab==="papers"} onClick={()=>setPubTab("papers")}>Papers</TabBtn>
      <TabBtn active={pubTab==="projects"} onClick={()=>setPubTab("projects")}>Current Projects</TabBtn>
    </div>
    {pubTab==="papers"&&<div>
      {["journal","conference"].map(type=><div key={type} style={{marginBottom:"36px"}}>
        <h3 style={{fontSize:"14px",fontWeight:600,color:"#818cf8",marginBottom:"14px",textTransform:"uppercase",letterSpacing:"1px"}}>{type==="journal"?"Journal Articles":"Conference Papers"}</h3>
        {d.publications.filter(p=>p.type===type).map((p,i)=>{const ri=d.publications.indexOf(p);return<Card key={ri} style={{marginBottom:"10px"}}><a href={p.link} target="_blank" rel="noopener noreferrer" style={{fontSize:"15px",fontWeight:600,color:"#e2e8f0",lineHeight:1.5,display:"block",marginBottom:"6px"}}>{p.title}</a><p style={{color:"#94a3b8",fontSize:"13px",marginBottom:"6px"}}>{p.authors}</p><div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}><Tag>{p.venue}</Tag><span style={{color:"#6366f1",fontSize:"13px",fontWeight:600}}>{p.year}</span></div><AdminBtns admin={admin} onEdit={()=>openEdit({title:"Edit Publication",fields:[{key:"title",label:"Title"},{key:"authors",label:"Authors"},{key:"venue",label:"Venue"},{key:"year",label:"Year"},{key:"link",label:"Link"},{key:"type",label:"Type (journal/conference)"}],initial:p,onSave:f=>up("publications",ri,f)})} onDel={()=>delItem("publications",ri)}/></Card>})}
      </div>)}
      {admin&&<Btn small onClick={()=>openEdit({title:"Add Publication",fields:[{key:"title",label:"Title"},{key:"authors",label:"Authors"},{key:"venue",label:"Venue"},{key:"year",label:"Year"},{key:"link",label:"Link"},{key:"type",label:"Type (journal/conference)"}],initial:{type:"journal"},onSave:f=>add("publications",f)})}>+ Add Publication</Btn>}
    </div>}
    {pubTab==="projects"&&<Sec title="Current Projects">
      {d.projects.map((p,i)=><Card key={i} style={{marginBottom:"14px"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:"8px"}}><h3 style={{fontSize:"16px",fontWeight:600,color:"#e2e8f0"}}>{p.title}</h3><span style={{padding:"3px 10px",borderRadius:"12px",fontSize:"11px",fontWeight:600,background:p.status==="Active"?"rgba(16,185,129,.12)":"rgba(99,102,241,.12)",color:p.status==="Active"?"#10b981":"#a5b4fc",border:"1px solid "+(p.status==="Active"?"rgba(16,185,129,.2)":"rgba(99,102,241,.15)")}}>{p.status}</span></div><p style={{color:"#94a3b8",fontSize:"14px",lineHeight:1.7,margin:"10px 0"}}>{p.desc}</p>{p.tech&&<div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>{p.tech.map((t,j)=><Tag key={j}>{t}</Tag>)}</div>}<AdminBtns admin={admin} onEdit={()=>openEdit({title:"Edit Project",fields:[{key:"title",label:"Title"},{key:"status",label:"Status"},{key:"desc",label:"Description",multi:true},{key:"techStr",label:"Tech (comma-separated)"}],initial:{...p,techStr:(p.tech||[]).join(", ")},onSave:f=>{const np={...f,tech:f.techStr?f.techStr.split(",").map(s=>s.trim()):[]};delete np.techStr;up("projects",i,np)}})} onDel={()=>delItem("projects",i)}/></Card>)}
      {admin&&<Btn small onClick={()=>openEdit({title:"Add Project",fields:[{key:"title",label:"Title"},{key:"status",label:"Status"},{key:"desc",label:"Description",multi:true},{key:"techStr",label:"Tech (comma-separated)"}],initial:{status:"Active"},onSave:f=>{const np={...f,tech:f.techStr?f.techStr.split(",").map(s=>s.trim()):[]};delete np.techStr;add("projects",np)}})}>+ Add Project</Btn>}
    </Sec>}
    <SocialBar d={d}/>
  </div>;

  const GalPage=()=><div>
    <div style={{display:"flex",gap:"8px",marginBottom:"30px",background:"rgba(13,13,26,.6)",padding:"6px",borderRadius:"10px",border:"1px solid rgba(99,102,241,.08)",width:"fit-content"}}>
      <TabBtn active={galTab==="photos"} onClick={()=>setGalTab("photos")}>Photos</TabBtn>
      <TabBtn active={galTab==="videos"} onClick={()=>setGalTab("videos")}>Videos</TabBtn>
    </div>
    {galTab==="photos"&&<div>
      {d.gallery.photos.map((yr,yi)=><Sec key={yi} title={yr.year}><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:"14px"}}>{yr.items.map((img,ii)=><div key={ii} style={{borderRadius:"12px",overflow:"hidden",border:"1px solid rgba(99,102,241,.1)",background:"#13131f"}}><img src={img.url} alt={img.caption} style={{width:"100%",height:"180px",objectFit:"cover",display:"block"}} onError={e=>{e.target.style.display="none"}}/><div style={{padding:"10px 12px"}}><p style={{color:"#cbd5e1",fontSize:"13px"}}>{img.caption}</p>{admin&&<div style={{marginTop:"6px",display:"flex",gap:"4px"}}><Btn small onClick={()=>openEdit({title:"Edit Photo",fields:[{key:"url",label:"Image URL"},{key:"caption",label:"Caption"}],initial:img,onSave:f=>updateGallery(g=>{g.photos[yi].items[ii]=f})})}>Edit</Btn><Btn small danger onClick={()=>updateGallery(g=>{g.photos[yi].items.splice(ii,1)})}>x</Btn></div>}</div></div>)}</div>{admin&&<div style={{marginTop:"10px"}}><Btn small onClick={()=>openEdit({title:"Add Photo to "+yr.year,fields:[{key:"url",label:"Image URL"},{key:"caption",label:"Caption"}],initial:{},onSave:f=>updateGallery(g=>{g.photos[yi].items.push(f)})})}>+ Add Photo</Btn></div>}</Sec>)}
      {admin&&<Btn small onClick={()=>openEdit({title:"Add Year Album",fields:[{key:"year",label:"Year"}],initial:{},onSave:f=>updateGallery(g=>{g.photos.push({year:f.year,items:[]})})})}>+ Add Year Album</Btn>}
    </div>}
    {galTab==="videos"&&<Sec title="Videos"><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:"16px"}}>{d.gallery.videos.map((v,i)=>{const ytId=getYTId(v.url);return<Card key={i} style={{padding:0,overflow:"hidden"}}>{ytId?<iframe src={"https://www.youtube.com/embed/"+ytId} title={v.title} style={{width:"100%",height:"200px",border:"none"}} allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowFullScreen/>:<div style={{width:"100%",height:"200px",background:"#1a1a2e",display:"flex",alignItems:"center",justifyContent:"center",color:"#64748b",fontSize:"13px"}}>Invalid YouTube URL</div>}<div style={{padding:"16px"}}><h4 style={{fontSize:"15px",fontWeight:600,color:"#e2e8f0",marginBottom:"4px"}}>{v.title}</h4><p style={{color:"#94a3b8",fontSize:"13px"}}>{v.desc}</p>{admin&&<div style={{marginTop:"8px",display:"flex",gap:"4px"}}><Btn small onClick={()=>openEdit({title:"Edit Video",fields:[{key:"title",label:"Title"},{key:"url",label:"YouTube URL"},{key:"desc",label:"Description"}],initial:v,onSave:f=>updateGallery(g=>{g.videos[i]=f})})}>Edit</Btn><Btn small danger onClick={()=>updateGallery(g=>{g.videos.splice(i,1)})}>x</Btn></div>}</div></Card>})}</div>{admin&&<div style={{marginTop:"12px"}}><Btn small onClick={()=>openEdit({title:"Add Video",fields:[{key:"title",label:"Title"},{key:"url",label:"YouTube URL"},{key:"desc",label:"Description"}],initial:{},onSave:f=>updateGallery(g=>{g.videos.push(f)})})}>+ Add Video</Btn></div>}</Sec>}
    <SocialBar d={d}/>
  </div>;

  const BlogPage=()=><div>
    <Sec title="Blog & Writing"><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:"16px"}}>{d.blogs.map((b,i)=><Card key={i} style={{display:"flex",flexDirection:"column"}}><span style={{color:"#6366f1",fontSize:"12px",fontWeight:600,marginBottom:"8px"}}>{b.date}</span><a href={b.link} target="_blank" rel="noopener noreferrer" style={{fontSize:"15px",fontWeight:600,color:"#e2e8f0",marginBottom:"8px",lineHeight:1.4}}>{b.title}</a><p style={{color:"#94a3b8",fontSize:"13px",lineHeight:1.6,flex:1}}>{b.summary}</p><AdminBtns admin={admin} onEdit={()=>openEdit({title:"Edit Blog",fields:[{key:"title",label:"Title"},{key:"date",label:"Date"},{key:"summary",label:"Summary",multi:true},{key:"link",label:"Link"}],initial:b,onSave:f=>up("blogs",i,f)})} onDel={()=>delItem("blogs",i)}/></Card>)}</div>{admin&&<div style={{marginTop:"14px"}}><Btn small onClick={()=>openEdit({title:"Add Blog",fields:[{key:"title",label:"Title"},{key:"date",label:"Date"},{key:"summary",label:"Summary",multi:true},{key:"link",label:"Link"}],initial:{},onSave:f=>add("blogs",f)})}>+ Add Blog</Btn></div>}</Sec>
    <SocialBar d={d}/>
  </div>;

  const CVPage=()=>{
    const toggles=d.cvToggles||{summary:true,education:true,experience:true,publications:true};
    const sections=d.cvSections||[];
    const toggleCV=(key)=>updateData({...d,cvToggles:{...toggles,[key]:!toggles[key]}});
    const moveSec=(idx,dir)=>{const arr=[...sections];const ni=idx+dir;if(ni<0||ni>=arr.length)return;[arr[idx],arr[ni]]=[arr[ni],arr[idx]];updateData({...d,cvSections:arr})};
    return <div>
    <Sec title="Curriculum Vitae">
      <Card>
        <p style={{color:"#94a3b8",fontSize:"14px",lineHeight:1.8,marginBottom:"24px"}}>For a detailed PDF, please contact me via email.</p>

        {admin&&<div style={{marginBottom:"24px",padding:"16px",borderRadius:"10px",background:"rgba(99,102,241,.06)",border:"1px solid rgba(99,102,241,.1)"}}>
          <p style={{color:"#818cf8",fontSize:"12px",fontWeight:600,textTransform:"uppercase",letterSpacing:"1px",marginBottom:"10px"}}>Toggle Sections</p>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
            {[{k:"summary",l:"Summary"},{k:"education",l:"Education"},{k:"experience",l:"Experience"},{k:"publications",l:"Publications"}].map(s=>
              <button key={s.k} onClick={()=>toggleCV(s.k)} style={{padding:"5px 14px",borderRadius:"6px",border:"1px solid "+(toggles[s.k]?"rgba(16,185,129,.3)":"rgba(239,68,68,.3)"),background:toggles[s.k]?"rgba(16,185,129,.1)":"rgba(239,68,68,.1)",color:toggles[s.k]?"#10b981":"#ef4444",fontSize:"12px",fontWeight:600,cursor:"pointer"}}>{toggles[s.k]?"\u2713":"\u2717"} {s.l}</button>
            )}
          </div>
        </div>}

        {toggles.summary&&<div style={{marginBottom:"24px"}}>
          <h3 style={{fontSize:"15px",fontWeight:600,color:"#818cf8",marginBottom:"10px"}}>Summary</h3>
          <p style={{color:"#cbd5e1",fontSize:"14px",lineHeight:1.8}}>{d.bio}</p>
        </div>}

        {toggles.education&&<div style={{marginBottom:"24px"}}>
          <h3 style={{fontSize:"15px",fontWeight:600,color:"#818cf8",marginBottom:"10px"}}>Education</h3>
          {d.education.map((e,i)=><p key={i} style={{color:"#cbd5e1",fontSize:"14px",marginBottom:"6px"}}>{"\u2022"} {e.degree} — {e.school} {e.year&&("("+e.year+")")}</p>)}
        </div>}

        {toggles.experience&&<div style={{marginBottom:"24px"}}>
          <h3 style={{fontSize:"15px",fontWeight:600,color:"#818cf8",marginBottom:"10px"}}>Experience</h3>
          {d.experience.map((e,i)=><p key={i} style={{color:"#cbd5e1",fontSize:"14px",marginBottom:"6px"}}>{"\u2022"} {e.role} — {e.org} {e.period&&("("+e.period+")")}</p>)}
        </div>}

        {sections.map((s,i)=><div key={s.id||i} style={{marginBottom:"24px"}}>
          <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"10px"}}>
            <h3 style={{fontSize:"15px",fontWeight:600,color:"#818cf8"}}>{s.title}</h3>
            {admin&&<div style={{display:"flex",gap:"4px",marginLeft:"auto"}}>
              {i>0&&<button onClick={()=>moveSec(i,-1)} style={{width:"24px",height:"24px",borderRadius:"4px",border:"1px solid rgba(99,102,241,.2)",background:"transparent",color:"#818cf8",fontSize:"11px",cursor:"pointer"}}>{"\u25B2"}</button>}
              {i<sections.length-1&&<button onClick={()=>moveSec(i,1)} style={{width:"24px",height:"24px",borderRadius:"4px",border:"1px solid rgba(99,102,241,.2)",background:"transparent",color:"#818cf8",fontSize:"11px",cursor:"pointer"}}>{"\u25BC"}</button>}
              <Btn small onClick={()=>openEdit({title:"Edit Section",fields:[{key:"title",label:"Section Title"},{key:"content",label:"Content (use \\n for new lines)",multi:true}],initial:s,onSave:f=>{const arr=[...sections];arr[i]={...arr[i],...f};updateData({...d,cvSections:arr})}})}>Edit</Btn>
              <Btn small danger onClick={()=>{const arr=[...sections];arr.splice(i,1);updateData({...d,cvSections:arr})}}>x</Btn>
            </div>}
          </div>
          {s.content.split("\n").map((line,li)=><p key={li} style={{color:"#cbd5e1",fontSize:"14px",marginBottom:"4px",lineHeight:1.6}}>{line.trim().startsWith("-")||line.trim().startsWith("\u2022")?line:line}</p>)}
        </div>)}

        {toggles.publications&&<div style={{marginBottom:"24px"}}>
          <h3 style={{fontSize:"15px",fontWeight:600,color:"#818cf8",marginBottom:"10px"}}>Publications ({d.publications.length})</h3>
          {d.publications.map((p,i)=><p key={i} style={{color:"#cbd5e1",fontSize:"13px",marginBottom:"8px",lineHeight:1.6}}>{"["+(i+1)+"] "}{p.authors}. "{p.title}." <i>{p.venue}</i>, {p.year}.</p>)}
        </div>}

        {admin&&<div style={{marginTop:"16px",paddingTop:"16px",borderTop:"1px solid rgba(99,102,241,.1)"}}><Btn small onClick={()=>openEdit({title:"Add CV Section",fields:[{key:"title",label:"Section Title"},{key:"content",label:"Content (use new lines for items)",multi:true}],initial:{},onSave:f=>{const ns={...f,id:"sec_"+Date.now()};updateData({...d,cvSections:[...sections,ns]})}})}>+ Add Section</Btn></div>}
      </Card>
    </Sec>
    <SocialBar d={d}/>
  </div>};

  const navItems=[{id:"home",label:"Home"},{id:"publications",label:"Publications"},{id:"gallery",label:"Gallery"},{id:"blog",label:"Blog"},{id:"cv",label:"CV"}];

  return <div style={{minHeight:"100vh",background:"#0a0a0f"}}>
    <nav ref={navRef} style={{position:"fixed",top:0,left:0,right:0,zIndex:100,background:"transparent",transition:"background .3s, border-bottom .3s, backdrop-filter .3s",padding:"0 24px",borderBottom:"1px solid transparent"}}>
      <div style={{maxWidth:"1100px",margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:"60px"}}>
        <span onClick={logoClick} style={{fontWeight:700,fontSize:"18px",background:"linear-gradient(135deg,#6366f1,#a78bfa)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",cursor:"pointer",userSelect:"none"}}>THM</span>
        <div style={{display:"flex",gap:"4px",alignItems:"center",flexWrap:"wrap"}}>
          {navItems.map(n=><TabBtn key={n.id} active={page===n.id} onClick={()=>setPage(n.id)}>{n.label}</TabBtn>)}
          {admin&&<React.Fragment>
            <div style={{width:"1px",height:"24px",background:"rgba(99,102,241,.2)",margin:"0 6px"}}/>
            <span style={{fontSize:"11px",color:"#10b981",fontWeight:600,letterSpacing:"1px"}}>{"\u25CF"} ADMIN</span>
            {hasUnsaved&&<button onClick={publishToGH} disabled={saving} style={{padding:"5px 14px",borderRadius:"6px",border:"none",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"#fff",fontSize:"11px",fontWeight:700,cursor:saving?"not-allowed":"pointer",marginLeft:"6px",opacity:saving?.6:1}}>{saving?"Publishing...":"Publish"}</button>}
            <button onClick={()=>setAdmin(false)} style={{padding:"5px 10px",borderRadius:"6px",border:"1px solid rgba(239,68,68,.3)",background:"transparent",color:"#ef4444",fontSize:"11px",cursor:"pointer",marginLeft:"4px"}}>Logout</button>
          </React.Fragment>}
        </div>
      </div>
    </nav>

    {admin&&hasUnsaved&&<div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:99,background:"linear-gradient(90deg,rgba(99,102,241,.15),rgba(139,92,246,.15))",borderTop:"1px solid rgba(99,102,241,.2)",padding:"12px 24px",display:"flex",alignItems:"center",justifyContent:"center",gap:"16px",backdropFilter:"blur(10px)"}}>
      <span style={{color:"#a5b4fc",fontSize:"13px",fontWeight:500}}>You have unpublished changes</span>
      <button onClick={publishToGH} disabled={saving} style={{padding:"6px 20px",borderRadius:"8px",border:"none",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"#fff",fontSize:"13px",fontWeight:700,cursor:saving?"not-allowed":"pointer",opacity:saving?.6:1}}>{saving?"Publishing...":"Publish Now"}</button>
    </div>}

    <main style={{maxWidth:"1100px",margin:"0 auto",padding:admin&&hasUnsaved?"90px 24px 80px":"90px 24px 40px"}}>
      {page==="home"&&<HomePage/>}
      {page==="publications"&&<PubPage/>}
      {page==="gallery"&&<GalPage/>}
      {page==="blog"&&<BlogPage/>}
      {page==="cv"&&<CVPage/>}
    </main>

    <footer style={{borderTop:"1px solid rgba(99,102,241,.1)",padding:"24px",textAlign:"center",marginBottom:admin&&hasUnsaved?"50px":0}}><p style={{color:"#475569",fontSize:"12px"}}>{"\u00A9"} 2025 {d.name}. Built with passion for research.</p></footer>

    {toast&&<div className={"toast toast-"+toast.type}>{toast.msg}</div>}

    <LoginModal open={loginOpen} onClose={()=>setLoginOpen(false)} onLogin={handleLogin}/>

    <EditModal config={editModal} form={editForm} setForm={setEditForm} onSave={saveEdit} onClose={closeEdit}/>
  </div>;
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
